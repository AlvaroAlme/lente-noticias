name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        env:
          GITHUB_PAGES: "true"
          # Configura esta variable en Settings > Secrets and variables >
          # Actions > Variables, con la URL pública del backend (Render).
          # Mientras no exista, la web se sirve igualmente pero las
          # llamadas a la API fallarán (útil para revisar solo el diseño).
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: npm run build

      # GitHub Pages no sabe que esto es una SPA con rutas de cliente
      # (react-router): sin este archivo, recargar en /article daría
      # 404. Servir una copia de index.html como 404.html hace que el
      # navegador cargue la app igualmente y React Router lea la URL.
      - name: SPA fallback for client-side routing
        run: cp frontend/dist/index.html frontend/dist/404.html

      - name: Disable Jekyll processing
        run: touch frontend/dist/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
